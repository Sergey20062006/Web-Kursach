<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kpishka - Мої нотатки</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/menu.css">
    <link rel="stylesheet" href="css/notes.css">
    <link rel="stylesheet" href="css/checklist.css">
    <link rel="stylesheet" href="css/modal.css">
</head>
<body class="dashboard-body">

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3>Меню</h3>
            <button id="close-sidebar-btn" title="Закрити"><i class="fas fa-times"></i></button>
        </div>
        <ul class="sidebar-menu">
            <li><a href="dashboard.html" class="active"><i class="fas fa-home"></i> Головна</a></li>
            <li><a href="archive.html"><i class="fas fa-archive"></i> Архів</a></li>
            
            <li style="margin-top: 20px; padding-left: 20px; font-size: 12px; font-weight: bold; color: #999; text-transform: uppercase;">Мої папки</li>
            <div id="folder-list">
                </div>
            <li style="padding: 15px 20px;">
                <button id="create-folder-btn" class="btn-small" style="width: 100%;"><i class="fas fa-plus"></i> Створити папку</button>
            </li>
            
            </ul>
    </nav>

    <header class="header">
        <div class="header-left">
            <button id="menu-btn"><i class="fas fa-bars"></i></button>
            <h2 class="logo-text">Kpishka</h2>
        </div>
        
        <div class="header-center">
            <input type="text" id="search-input" placeholder="Пошук нотаток...">
        </div>
        
        <div class="header-right">
            <div class="profile-dropdown">
                <button id="profile-btn"><i class="fas fa-user"></i> <span id="profile-name">Завантаження...</span></button>
                
                <div class="dropdown-content" id="dropdown-menu">
                    <a href="#" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Вийти</a>
                </div>
            </div>
        </div>
    </header>

    <main class="dashboard-container">
        <div class="notes-grid" id="notes-grid">
            
            <div class="note-card add-note-card" id="add-note-btn">
                <i class="fas fa-plus"></i>
                <p>Додати нотатку</p>
            </div>

            </div>
    </main>

    <div id="note-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <span class="close-btn" id="close-modal">&times;</span>

            <div class="modal-header-inputs">
                <input type="text" id="note-title" placeholder="Заголовок нотатки...">
                <div class="priority-group">
                    <span class="priority-label">Пріоритет:</span>
                    <select id="note-priority">
                        <option value="1">Звичайний</option>
                        <option value="2" selected>Середній</option>
                        <option value="3">Важливий</option>
                    </select>
                </div>

                <div class="priority-group" style="margin-left: 15px;">
                    <span class="priority-label">Папка:</span>
                    <select id="note-folder">
                        <option value="">Без папки</option>
                        </select>
                </div>
            </div>

            <div class="mode-toggle">
                <label class="checkbox-label">
                    <input type="checkbox" id="checklist-toggle"> Режим "Чек-лист"
                </label>
            </div>

            <div class="modal-body-inputs">
                <textarea id="note-text" placeholder="Почніть писати тут..."></textarea>
                
                <div id="checklist-area" style="display: none;">
                    <div id="todo-items-list">
                        </div>
                    <button id="add-todo-btn" class="btn-small"><i class="fas fa-plus"></i> Додати пункт</button>
                </div>
            </div>

            <div class="modal-footer">
                <button id="delete-note-btn" class="icon-btn delete-btn" title="В архів"><i class="fas fa-trash"></i></button>
                <button id="save-note-btn" class="btn">Зберегти</button>
            </div>
        </div>
    </div>


    <script src="js/dashboard.js"></script>
</body>
</html>
